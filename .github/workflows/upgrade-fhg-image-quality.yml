name: Upgrade FHG portraits from Canva originals
on:
  push:
    paths:
      - .github/workflows/upgrade-fhg-image-quality.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install pillow
      - name: Try highest-resolution image delivery
        run: |
          python - <<'PY'
          import urllib.request,io,os,re
          from PIL import Image
          items=[{"path":"assets/people/fhg-founder.png","url":"https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2Ff7f80fa5-047f-4a11-bcc5-4bb86acb00f6/watermark:F/width:179?csig=AAAAAAAAAAAAAAAAAAAAAEiX7Dudk7b0IIREC9Ire0mRT4XXDZHLCguMtuu3kmJ5&exp=1792366003&osig=AAAAAAAAAAAAAAAAAAAAALKvlxCn3jHG6BGwx-NbbkLHabccDLcLCCn2X9_iyMZa&signer=media-rpc&token=AAIAAU0AJGY3ZjgwZmE1LTA0N2YtNGExMS1iY2M1LTRiYjg2YWNiMDBmNgAAAAABoVFWwzg9FP0KbF6mZOw9sCYK_i2QRkfHNxyFtbZmtWNq-eK_-A&x-canva-quality=thumbnail","width":192,"height":214,"thumbWidth":179,"thumbHeight":200},{"path":"assets/people/fhg-president.png","url":"https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F90673132-359e-4384-ae73-542ca1eccb26/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAHlTflgSXJFzvLpeUbyu8PGS1I2qJoCqQ9HSGARUEPRB&exp=1792368413&osig=AAAAAAAAAAAAAAAAAAAAAMhPjI_UmuhY5JPAMlhrWdsRGjuOKFr7DaPC30Qx_8jJ&signer=media-rpc&token=AAIAAU0AJDkwNjczMTMyLTM1OWUtNDM4NC1hZTczLTU0MmNhMWVjY2IyNgAAAAABoVF7iUi6brmJFX3cW65X1DwlvZVqqKPibJmEGqv1qGcPlNWIOg&x-canva-quality=thumbnail","width":400,"height":400,"thumbWidth":200,"thumbHeight":200},{"path":"assets/people/fhg-pillar.png","url":"https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F36622f74-4a12-49a2-b813-5818ac24efd4/watermark:F/width:199?csig=AAAAAAAAAAAAAAAAAAAAAKpnUHcN7SlI7m6YU_zVaZieWYVCF2WQ7eY_3C9VGMti&exp=1792367819&osig=AAAAAAAAAAAAAAAAAAAAAEmGxQgTTyIl2wjm9upbiVWNrjzIa_qKG-o5yMxZaN8x&signer=media-rpc&token=AAIAAU0AJDM2NjIyZjc0LTRhMTItNDlhMi1iODEzLTU4MThhYzI0ZWZkNAAAAAABoVFyePjQUTVz3gaQdnVYUxNwodSh7qhpWA3lfs5NhY5GwZMV8g&x-canva-quality=thumbnail","width":553,"height":554,"thumbWidth":199,"thumbHeight":200},{"path":"assets/people/olalekan.png","url":"https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2Fc8df3c44-7916-4750-8c6f-148ccd286da3/watermark:F/width:135?csig=AAAAAAAAAAAAAAAAAAAAALqcGxM32Yw_A3X_f_V1zMkGRQVvWJHCQ2FLqwxzgOd8&exp=1792366536&osig=AAAAAAAAAAAAAAAAAAAAABoNWXLuywyffPJFii79et7p7HvatKa8fsWQGDJBnV21&signer=media-rpc&token=AAIAAU0AJGM4ZGYzYzQ0LTc5MTYtNDc1MC04YzZmLTE0OGNjZDI4NmRhMwAAAAABoVFe5UAbrl4KZwOTc6Fem-LXcnWEBw8aA3Y02ntDdMjZpzcNnw&x-canva-quality=thumbnail","width":1080,"height":1600,"thumbWidth":135,"thumbHeight":200}]
          for item in items:
              u=item['url']
              test_urls=[('thumbnail',u)]
              full=re.sub(r'/height:\\d+', '/height:'+str(item['height']), u)
              full=re.sub(r'/width:\\d+', '/width:'+str(item['width']), full)
              test_urls.insert(0,('full',full))
              best=None
              for typ,url in test_urls:
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                      with urllib.request.urlopen(req,timeout=20) as res: b=res.read()
                      with Image.open(io.BytesIO(b)) as im:
                          im.load();dim=im.size
                          print(item['path'],typ,'loaded',dim,'bytes',len(b))
                          if min(dim)>min((item['thumbWidth'],item['thumbHeight'])) and (best is None or dim[0]*dim[1]>best[0][0]*best[0][1]): best=(dim,b)
                  except Exception as e: print(item['path'],typ,'failed',str(e)[:250])
              if best:
                  path=item['path'];os.makedirs(os.path.dirname(path),exist_ok=True)
                  with Image.open(io.BytesIO(best[1])) as im: im.convert('RGB').save(path,'JPEG',quality=93,optimize=True,subsampling=0)
                  # Switch to path with jpg extension? keep PNG bytes via source file best bytes
                  open(path,'wb').write(best[1]); print('UPGRADED',path,best[0])
              else: print('NO HIGH RES OPTION',item['path'])
          PY
      - name: Commit upgrades
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/people
          if ! git diff --cached --quiet; then git commit -m "Replace low-resolution portraits with sharp originals" && git push; fi

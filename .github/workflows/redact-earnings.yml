name: Redact names in FHG earnings images
on:
  push:
    paths:
      - scripts/redact_earnings.py
      - .github/workflows/redact-earnings.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  anonymize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install Pillow
      - name: Rewrite screenshots with anonymous versions
        run: python scripts/redact_earnings.py
      - name: Commit sanitized screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/team-results/*.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Redact names and identifiers in FHG earnings screenshots"
            git push
          fi

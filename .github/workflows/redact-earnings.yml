name: Repair FHG published evidence
on:
  push:
    paths:
      - scripts/redact_earnings.py
      - .github/workflows/redact-earnings.yml
  workflow_dispatch:
concurrency:
  group: fhg-published-evidence
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  repair-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image dependency
        run: python -m pip install Pillow
      - name: Restore originals and blur poster identities only
        run: python scripts/redact_earnings.py
      - name: Publish properly redacted team and FHG images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/team-results/ assets/fhg-stories/ testimonials.html
          if ! git diff --cached --quiet; then
            git commit -m "Publish corrected FHG proof images with sender-only redaction"
            git push
          fi

name: Import latest team and FHG achievements
on:
  push:
    paths: [.github/workflows/import-fhg-results-oct.yml]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install pillow
      - name: Store screenshot originals
        run: |
          python - <<'PY'
          from pathlib import Path
          import urllib.request,io
          from PIL import Image,ImageDraw
          items=[["172561.jpg","https://d2jqrm6oza8nb6.cloudfront.net/datasets/4cb40f56-a16e-409a-b30e-dde0c3ee5704.jpg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYzRjY2YxMWIzYzY2ZjJkZiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MjUzMDIwM30.RXXe9l8yBBA9mRX9V4AFj7Tizzqdmd6wnnC0_CiJyS0"],["173276.jpg","https://d2jqrm6oza8nb6.cloudfront.net/datasets/b1b465f5-ba1e-42c8-a06d-1b7220972232.jpg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNDQxZDE3YjM2ZTU3MzIxOSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MjU3MTY5OX0.3IyVUQey8pXQBQ4IcTGjHSdbSYeZfGVV6dgL2oXLlsA"],["175733.jpg","https://d2jqrm6oza8nb6.cloudfront.net/datasets/ea1ee09b-218b-42e0-92c2-91717aada7ba.jpg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNmM0ZWI2OTllZmNlODJiMiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MjU2MDI4MX0.IY2AeMRzFybFTaA-WlTQ0HUGODe4Xzm2CGQuV1JvuO4"]]
          dest=Path('assets/team-results');fhg=Path('assets/fhg-stories');dest.mkdir(exist_ok=True,parents=True);fhg.mkdir(exist_ok=True,parents=True)
          for fname,url in items:
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
            with urllib.request.urlopen(req,timeout=40) as r: raw=r.read()
            im=Image.open(io.BytesIO(raw)).convert('RGB')
            if im.height<1000:raise RuntimeError('Unexpected image size '+fname)
            path=(dest if fname=='172561.jpg' else fhg)/fname
            if fname=='172561.jpg':
              # Hide only displayed account-owner identification, not earnings or performance.
              ImageDraw.Draw(im).rectangle((0,53,285,126),fill=(25,27,30))
            if fname=='173276.jpg':
              # Remove visible ID number from the rank card; preserve member, rank and vehicle.
              ImageDraw.Draw(im).rectangle((0,991,340,1034),fill=(247,247,246))
            im.save(path,'JPEG',quality=93,optimize=True,subsampling=0)
            print('Imported',path,im.size)
          
          PY
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/team-results/172561.jpg assets/fhg-stories/173276.jpg assets/fhg-stories/175733.jpg
          if ! git diff --cached --quiet; then git commit -m "Publish Emily dashboard and two FHG vehicle milestones" && git push; fi

name: Add FHG Team 200 Dollar Order Screenshot
on:
  push:
    paths:
      - .github/workflows/import-fhg-team-order-200.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Import original screenshot and hide poster name
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          from PIL import Image, ImageFilter
          import urllib.request
          url="https://d2jqrm6oza8nb6.cloudfront.net/datasets/ef98594e-e00b-4bbe-b848-41420f52fcc8.jpeg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiOWIzOGYzYTdmMmYyMTE1MSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MjU1OTI3MX0.4IoBqhv7Xt0qKbR0SE_Pt5dYaCUWW7KO5cSMA_qafpk"
          destination=Path('assets/team-results/1792428174968.jpg')
          request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(request,timeout=45) as response: binary=response.read()
          with Image.open(BytesIO(binary)) as input_image:
              im=input_image.convert('RGB')
          assert im.size==(691,1536),f'Unexpected image size: {im.size}'
          # Hide only the poster's displayed name (and surrounding identification)
          # while preserving all named uplines, including Mr Oyekunle Musodiq.
          box=(78,228,310,280)
          crop=im.crop(box)
          blurred=crop.resize((12,4),Image.Resampling.BOX).resize(crop.size,Image.Resampling.NEAREST).filter(ImageFilter.GaussianBlur(13))
          im.paste(blurred,box)
          destination.parent.mkdir(parents=True,exist_ok=True)
          im.save(destination,'JPEG',quality=93,optimize=True,subsampling=0)
          print('Saved user-provided team result:',destination,im.size)
          PY
      - name: Commit evidence file to website repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/team-results/1792428174968.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Import 200 dollar team order screenshot"
            git push
          fi
